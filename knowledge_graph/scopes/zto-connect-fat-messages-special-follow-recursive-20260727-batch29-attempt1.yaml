id: zto-connect-fat-messages-special-follow-recursive-20260727-batch29-attempt1
title: 从工作台恢复到特别关注提醒设置页

target:
  platform: android
  applicationKey: zto.connect
  packageId: com.zto.connect.fat
  featureOrPage: 消息页顶部工具栏“特别关注”入口（爱心图标）及入口下全部内容
  userIntent: 从当前工作台实际落点恢复消息页、特别关注页和特别关注提醒设置页，继续递归探索。
  environment: fat
  knownFacts:
    - {subjectKey: messages.toolbar.heart, predicate: function_name, value: 特别关注, source: user}
    - {subjectKey: messages.special_follow.unread_list, predicate: behavior, value: 设置特别关注人员后，该人员存在未读消息时，其会话显示在特别关注列表中。, source: user}
    - {subjectKey: messages.toolbar.heart, predicate: unread_visual_state, value: 特别关注人员存在未读消息时，入口爱心图标变为橙黄色。, source: user}

entry:
  knownStartPageKey: workbench.root
  launchComponent: com.zto.connect.fat/com.zto.zbox.module.main.ZBoxMainActivity
  navigationHint: 当前位于工作台；依次点击底部消息标签、消息页特别关注爱心入口、特别关注空状态中的设置特别关注链接。
  requireColdStart: false
  requireUserPreparedState: true

device:
  serialHash: sha256:b1485ad4b9da3cb307ec62ea7b5c062bd3753b1875f0897bdbe49cba51e5eb36
  expectedOrientation: portrait
  expectedRotationDegrees: 0
  expectedPhysicalSizePx: {width: 1344, height: 2772}
  expectedEffectiveSizePx: {width: 1152, height: 2376}
  expectedCurrentDisplaySizePx: {width: 1152, height: 2376}
  requireUnlocked: true
  requireNoExternalOverlay: true

scope:
  mode: recursive_feature
  maxDepth: 4
  maxActions: 6
  include: [messages.root, messages.toolbar.heart, messages.special_follow, messages.special_follow.settings]
  exclude: [external_application, system_credentials]
  entryOnly: []
  stopAt: [messages.special_follow.settings.recovered]
  unknownControlPolicy: inspect_all_activate_safe
  traversal: breadth_first
  deduplicateBy: semantic_presentation_signature
  requireQueueExhaustion: true
  viewportOnly: false

safety:
  allowedRiskLevels: [safe, low]
  allowedSideEffects: [navigation_history, temporary_display_state]
  prohibitedSideEffects: [message_send, form_submit, data_delete, payment, external_share, attendance_check_in, lottery_participation, permission_change, persistent_setting_change, account_change, logout]
  forbiddenLabelsOrKeys: [编辑, 删除, 发送, 提交, 支付, 签到, 抽奖, 分享, 权限, 退出登录]
  credentialsPolicy: require_user_intervention

capture:
  coordinateSpace: current_display_px
  expectedScreenshotSizePx: {width: 1152, height: 2376}
  captureRectScreenPx: {x: 0, y: 0, width: 1344, height: 2772}
  stableFrameSampleCount: 3
  stableFrameIntervalMs: 500
  visualDistanceThreshold: 0.02
  captureBeforeAndAfterEveryAction: true
  requireForegroundVerification: true
  requireFullPagePng: true
  recordPhysicalGesture: true
  recordPostcondition: true
  persistUiTree: false
  persistPocoTree: false
  semanticRecognition: {provider: midscene, required: true, persistDecisionEvidence: true, failurePolicy: abort}

execution:
  framework: midscene
  requireSemanticLocator: true
  requireSemanticPostconditions: true
  defaultWaitMs: 2500
  allowedTargetScopes: [feature_entry, page_navigation, settings_navigation]
  allowedTapRegions:
    - key: bottom-messages-tab
      space: current_display_px
      rect: {x: 250, y: 2160, width: 220, height: 210}
      purpose: 宝盒主界面底部“消息”标签区域。
    - key: messages-toolbar-heart
      space: current_display_px
      rect: {x: 225, y: 545, width: 150, height: 145}
      purpose: 消息页顶部快捷工具栏中特别关注入口区域。
    - key: special-follow-setup-link
      space: current_display_px
      rect: {x: 330, y: 1390, width: 480, height: 210}
      purpose: 特别关注空状态页“设置特别关注 >”入口区域。

expectedStates:
  - key: workbench.root
    label: 工作台
    kind: page
    expectedStablePageKey: workbench.root
    requiredSemanticAssertions:
      - 当前屏幕底部“工作台”标签已选中，“消息”标签可见。
    inspection:
      queryPrompt: 完整盘点工作台当前全屏可见交互控件和底部标签；如有“重要消息未读”提示气泡也如实记录但不激活。
      locateAllInteractiveControls: true
      includeControlTypes: [button, icon_button, list_entry, tab, close, menu, scroll_region]
      requireScrollCoverage: false
    allowedActions: [open_messages]
    postcondition: 已确认工作台实际恢复落点。
  - key: messages.root.recovered
    label: 消息页恢复状态
    kind: page
    expectedStablePageKey: messages.root
    requiredSemanticAssertions:
      - 当前屏幕底部“消息”标签已选中，会话列表和顶部快捷工具栏可见，特别关注爱心入口可见。
    inspection:
      queryPrompt: 完整盘点消息页当前全屏可见控件；用户确认爱心形状入口名为“特别关注”。
      locateAllInteractiveControls: true
      includeControlTypes: [button, icon_button, list_entry, tab, close, menu, scroll_region]
      requireScrollCoverage: false
    allowedActions: [open_special_follow]
    postcondition: 已恢复消息页并确认特别关注入口。
  - key: messages.special_follow.recovered
    label: 特别关注恢复状态
    kind: page
    expectedStablePageKey: messages.special_follow
    requiredSemanticAssertions:
      - 当前屏幕标题为“特别关注”，空状态说明和“设置特别关注 >”入口可见。
    inspection:
      queryPrompt: 完整盘点特别关注当前全屏可见控件、空状态、返回控件和设置特别关注入口。
      locateAllInteractiveControls: true
      includeControlTypes: [button, icon_button, link, list_entry, back, close, scroll_region]
      requireScrollCoverage: false
    allowedActions: [open_special_follow_settings]
    postcondition: 已恢复特别关注空状态页。
  - key: messages.special_follow.settings.recovered
    label: 特别关注提醒设置页恢复状态
    kind: page
    expectedStablePageKey: messages.special_follow.settings
    requiredSemanticAssertions:
      - 当前屏幕标题为“特别关注提醒”，“我的特别关注”和主要提醒设置可见。
    inspection:
      queryPrompt: 完整盘点恢复后的特别关注提醒设置页全屏可见控件及其当前状态，不激活任何设置。
      locateAllInteractiveControls: true
      includeControlTypes: [button, icon_button, list_entry, toggle, radio, back, close, scroll_region]
      requireScrollCoverage: false
    allowedActions: []
    postcondition: 已恢复特别关注提醒设置页并记录当前持久状态。

actions:
  - id: capture-workbench-recovery-start
    kind: capture
    state: workbench.root
    depth: 0
  - id: open-messages-from-workbench
    kind: tap
    semanticAction: open_messages
    fromState: workbench.root
    toState: messages.root.recovered
    depth: 1
    risk: safe
    sideEffects: [navigation_history]
    waitMs: 2500
    target:
      key: main.bottom.messages
      label: 消息
      scope: page_navigation
      locatorPrompt: 定位底部导航栏中带双对话气泡图标、文字为“消息”的标签；不要定位页面上方任何“消息”文字或提示气泡。
      allowedRegionRef: bottom-messages-tab
    postcondition:
      expectedForegroundPackage: com.zto.connect.fat
      requiredScreenshotChange: true
      semanticAssertions:
        - 当前屏幕底部“消息”标签已选中，会话列表和顶部快捷工具栏可见。
  - id: open-special-follow-from-recovered-messages
    kind: tap
    semanticAction: open_special_follow
    fromState: messages.root.recovered
    toState: messages.special_follow.recovered
    depth: 2
    risk: safe
    sideEffects: [navigation_history]
    waitMs: 2500
    target:
      key: messages.toolbar.heart
      label: 特别关注入口
      scope: feature_entry
      locatorPrompt: 定位消息页会话列表上方快捷工具栏从左数第三个爱心图标；用户确认该入口名为“特别关注”，不要定位底部导航图标。
      allowedRegionRef: messages-toolbar-heart
    postcondition:
      expectedForegroundPackage: com.zto.connect.fat
      requiredScreenshotChange: true
      semanticAssertions:
        - 当前屏幕已进入标题为“特别关注”的页面。
  - id: open-special-follow-settings-from-recovered-page
    kind: tap
    semanticAction: open_special_follow_settings
    fromState: messages.special_follow.recovered
    toState: messages.special_follow.settings.recovered
    depth: 3
    risk: safe
    sideEffects: [navigation_history]
    waitMs: 2500
    target:
      key: special_attention_setup
      label: 设置特别关注
      scope: settings_navigation
      locatorPrompt: 定位特别关注空状态页中央偏下、灰色说明文字下方的蓝色文字链接“设置特别关注 >”。
      allowedRegionRef: special-follow-setup-link
    postcondition:
      expectedForegroundPackage: com.zto.connect.fat
      requiredScreenshotChange: true
      semanticAssertions:
        - 当前屏幕已进入标题为“特别关注提醒”的设置页，“我的特别关注”和主要提醒设置可见。

