    - messages.conversation.row
  stopAt:
    - messages.toolbar.heart.destination.unresolved
  unknownControlPolicy: observe_only
  viewportOnly: true

safety:
  allowedRiskLevels: [safe, low]
  allowedSideEffects: [navigation_history]
  prohibitedSideEffects:
    - message_send
    - form_submit
    - data_delete
    - payment
    - external_share
    - attendance_check_in
    - lottery_participation
    - permission_change
    - account_change
    - logout
  forbiddenLabelsOrKeys:
