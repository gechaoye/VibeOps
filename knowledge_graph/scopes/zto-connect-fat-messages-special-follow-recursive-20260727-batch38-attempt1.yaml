expectedStates:
  - key: messages.special_follow.settings.popup_interval_1_hour
    label: 设置页顶部且提示音行被裁切
    kind: page
    expectedStablePageKey: messages.special_follow.settings
    requiredSemanticAssertions: [页面标题为特别关注提醒，首个间隔时间显示1小时，特别关注提示音行位于视口底部且点击区域未完整显示。]
    inspection:
      queryPrompt: 完整盘点当前视口中拥有完整点击区域的交互控件。特别关注提示音行在屏幕最底部被裁切，只记录为内容，禁止放入 visibleControls；设置页纵向滚动区域必须作为 scroll_region 返回。
      locateAllInteractiveControls: true
      includeControlTypes: [button, icon_button, list_entry, toggle, back, close, scroll_region]
      requireScrollCoverage: false
    allowedActions: [scroll_settings_for_sound]
    postcondition: 已记录滚动前设置页状态。
  - key: messages.special_follow.settings.sound_visible
    label: 特别关注提示音行完整可见
    kind: page
    expectedStablePageKey: messages.special_follow.settings
    requiredSemanticAssertions: [页面仍为特别关注提醒，特别关注提示音整行及其当前值简报已完整进入视口。]
    inspection:
      queryPrompt: 完整盘点滚动后的当前视口全部交互控件；特别关注提示音整行完整可见，必须作为可定位的 list_entry 返回；被上下边界裁切的其他行只记录为内容。
      locateAllInteractiveControls: true
      includeControlTypes: [button, icon_button, list_entry, toggle, back, close, scroll_region]
      requireScrollCoverage: false
    allowedActions: []
    postcondition: 已将提示音设置入口完整带入视口。

actions:
  - {id: capture-settings-before-sound-scroll, kind: capture, state: messages.special_follow.settings.popup_interval_1_hour, depth: 4}
  - id: scroll-settings-for-sound
    kind: scroll
    semanticAction: scroll_settings_for_sound
    fromState: messages.special_follow.settings.popup_interval_1_hour
    toState: messages.special_follow.settings.sound_visible
    depth: 4
    risk: safe
    sideEffects: [viewport_scroll]
    direction: up
    actionPrompt: 在当前特别关注提醒设置页纵向向上滑动较短距离，让底部“特别关注提示音”整行完整进入屏幕；不要点击或切换任何设置控件。
    waitMs: 1800
    target: {key: special_follow_settings_scroll, label: 特别关注提醒设置页, scope: scroll_region, locatorPrompt: 定位当前特别关注提醒页面白色设置内容的纵向可滚动区域，避开所有开关、设置行和顶部返回按钮。, allowedRegionRef: settings-scroll-region}
    postcondition: {expectedForegroundPackage: com.zto.connect.fat, requiredScreenshotChange: true, semanticAssertions: [页面仍为特别关注提醒，特别关注提示音整行及当前值简报已完整进入视口。]}

