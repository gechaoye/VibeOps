    label: 提醒方式短信设置页
    kind: page
    expectedStablePageKey: messages.special_follow.settings
    requiredSemanticAssertions:
      - 页面没有底部面板；短信/电话提醒间隔行下方、夜间免打扰上方的“提醒方式”行右侧显示“短信”。
