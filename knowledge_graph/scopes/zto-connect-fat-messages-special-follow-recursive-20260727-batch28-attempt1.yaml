    requiredSemanticAssertions:
      - 底部面板显示短信、电话和取消，电话为蓝色对勾选中。
    inspection:
      queryPrompt: 完整盘点提醒方式面板的短信、电话和取消；背景页控件不作为当前可操作控件。
