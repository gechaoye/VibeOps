expectedStates:
  - key: messages.special_follow.settings.sms_phone_reminder.method.selector_sms
    label: 提醒方式面板短信选中
    kind: dialog
    expectedStablePageKey: messages.special_follow.settings.sms_phone_reminder.method
    requiredSemanticAssertions:
      - 底部面板显示短信、电话和取消，短信为蓝色对勾选中。
    inspection:
      queryPrompt: 完整盘点提醒方式面板的短信、电话和取消；背景遮罩及背景页控件只记录为呈现，不作为当前可操作控件。
      locateAllInteractiveControls: true
      includeControlTypes: [button, list_entry, radio, close]
      requireScrollCoverage: false
    allowedActions: [select_reminder_method_phone]
    postcondition: 已记录短信选中状态。
