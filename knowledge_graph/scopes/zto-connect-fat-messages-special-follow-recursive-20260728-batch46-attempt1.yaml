  userIntent: 从存在未读会话的特别关注页进入设置，验证非空成员状态下的添加入口会打开 APP 级通用选择人员组件，并验证返回设置页。
  environment: fat
  knownFacts:
    - {subjectKey: messages.toolbar.heart, predicate: function_name, value: 特别关注, source: user}
    - {subjectKey: messages.special_follow.member_with_unread, predicate: conversation_visibility, value: 设置为特别关注的人员存在未读消息时，该人员的会话显示在特别关注列表。, source: user}
