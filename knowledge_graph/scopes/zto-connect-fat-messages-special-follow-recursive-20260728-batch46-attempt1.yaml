    - {subjectKey: messages.special_follow.add, predicate: target_component, value: 点击添加后进入 APP 级通用选择人员组件；只记录入口和往返关系，不递归探索组件内部。, source: user}
    - {subjectKey: exploration.authorization, predicate: may_operate_settings_and_members, value: "true", source: user}

