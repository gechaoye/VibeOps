  userIntent: 从特别关注入口开始，递归探索全部安全可达子页面、状态、滚动内容和交互控件。
  environment: fat
  knownFacts:
    - subjectKey: messages.toolbar.heart
      predicate: function_name
      value: 特别关注
      source: user

entry:
