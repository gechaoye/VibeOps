  traversal: breadth_first
  deduplicateBy: semantic_presentation_signature
  requireQueueExhaustion: true
  viewportOnly: false

safety:
  allowedRiskLevels: [safe, low]
  allowedSideEffects: [navigation_history, viewport_scroll, temporary_display_state]
  prohibitedSideEffects:
    - message_send
    - form_submit
    - data_delete
    - payment
    - external_share
    - attendance_check_in
    - lottery_participation
    - permission_change
    - persistent_setting_change
    - account_change
    - logout
  forbiddenLabelsOrKeys:
    - 编辑
    - 删除
    - 发送
    - 提交
    - 支付
    - 签到
    - 抽奖
    - 分享
    - 权限
    - 退出登录
  credentialsPolicy: require_user_intervention

capture:
  coordinateSpace: current_display_px
  expectedScreenshotSizePx:
    width: 1152
    height: 2376
  captureRectScreenPx:
    x: 0
    y: 0
    width: 1344
    height: 2772
  stableFrameSampleCount: 3
  stableFrameIntervalMs: 500
  visualDistanceThreshold: 0.02
  captureBeforeAndAfterEveryAction: true
  requireForegroundVerification: true
  requireFullPagePng: true
  recordPhysicalGesture: true
  recordPostcondition: true
  persistUiTree: false
  persistPocoTree: false
  semanticRecognition:
    provider: midscene
    required: true
    persistDecisionEvidence: true
    failurePolicy: abort

execution:
  framework: midscene
  requireSemanticLocator: true
  requireSemanticPostconditions: true
  defaultWaitMs: 2500
  allowedTargetScopes:
    - feature_entry
    - page_navigation
    - page_content
    - settings_navigation
    - temporary_state_control
    - scroll_region
  allowedTapRegions:
    - key: messages-toolbar-heart
      space: current_display_px
      rect:
        x: 225
        y: 545
        width: 150
        height: 145
      purpose: 消息页顶部工具栏中特别关注入口的实时 Midscene 定位范围。
    - key: app-visible-content
      space: current_display_px
      rect:
        x: 0
        y: 96
        width: 1152
        height: 2184
      purpose: 后续批次中经风险策略允许的应用内导航、临时状态和滚动控件范围。

expectedStates:
  - key: messages.root
    label: 消息
    kind: page
    expectedStablePageKey: messages.root
    requiredSemanticAssertions:
      - 当前屏幕底部“消息”Tab 已选中，会话列表可见，横幅下方快捷工具栏从左数第三个空心爱心图标可见。
    inspection:
      queryPrompt: 盘点当前视口全部可见交互控件；用户确认消息页顶部爱心形状入口名为“特别关注”。
      locateAllInteractiveControls: true
      includeControlTypes: [button, icon_button, link, menu, list_entry, toggle, checkbox, radio, segmented_control, tab, slider, stepper, input, back, close, scroll_region]
      requireScrollCoverage: true
    allowedActions: [open_special_follow]
    postcondition: 消息页入口状态经 Midscene 验证。
  - key: messages.special_follow.initial
    label: 特别关注初始状态
    kind: page
    expectedStablePageKey: messages.special_follow
    requiredSemanticAssertions:
      - 当前屏幕是由消息页特别关注入口打开的稳定页面，页面标题、主要内容、空状态或列表状态以及顶栏控件均可见并可描述。
    inspection:
      queryPrompt: 盘点特别关注页面当前视口的全部开关、设置、图标、按键、列表入口、返回控件和可滚动区域，不从图标形状猜测未知含义。
      locateAllInteractiveControls: true
      includeControlTypes: [button, icon_button, link, menu, list_entry, toggle, checkbox, radio, segmented_control, tab, slider, stepper, input, back, close, scroll_region]
      requireScrollCoverage: true
    allowedActions: [navigate_back, activate, open_settings, scroll_down, scroll_up, show_temporary_state]
    postcondition: 特别关注初始状态完成全控件盘点，安全目标进入下一批队列。

actions:
  - id: capture-prepared-messages-root
    kind: capture
    state: messages.root
    depth: 0
  - id: open-special-follow
    kind: tap
    semanticAction: open_special_follow
    fromState: messages.root
    toState: messages.special_follow.initial
    depth: 1
    risk: safe
    sideEffects: [navigation_history]
    waitMs: 2500
    target:
      key: messages.toolbar.heart
      label: 特别关注入口
      scope: feature_entry
      locatorPrompt: 消息页顶部工具栏内靠左一侧的爱心轮廓图标，即用户确认名为“特别关注”的入口；它位于会话列表上方，不是底部导航图标。
      allowedRegionRef: messages-toolbar-heart
    postcondition:
      expectedForegroundPackage: com.zto.connect.fat
      requiredScreenshotChange: true
      semanticAssertions:
        - 当前屏幕已进入标题或主要语义为“特别关注”的稳定页面，且宝盒测试包仍在前台。

