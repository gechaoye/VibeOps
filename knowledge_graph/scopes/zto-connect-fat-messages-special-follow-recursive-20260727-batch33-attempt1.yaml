      includeControlTypes: [button, icon_button, list_entry, toggle, back, close, scroll_region]
      requireScrollCoverage: false
    allowedActions: [disable_sms_phone_reminder]
    postcondition: 已记录短信电话提醒开启及子项可见状态。
  - key: messages.special_follow.settings.sms_phone.disabled
    label: 短信电话提醒关闭且子项隐藏
    kind: page
    expectedStablePageKey: messages.special_follow.settings
    requiredSemanticAssertions: [短信/电话提醒开关为灰色关闭状态；其独立间隔时间、提醒方式、夜间免打扰和22:00至次日06:00说明均不再显示；单聊弹窗提醒及其间隔仍显示。]
