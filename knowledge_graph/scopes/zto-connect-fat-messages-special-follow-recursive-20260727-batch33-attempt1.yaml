    allowedActions: [enable_sms_phone_reminder]
    postcondition: 已验证短信电话提醒关闭时子项整体隐藏。
  - key: messages.special_follow.settings.sms_phone.enabled_restored
    label: 短信电话提醒重新开启且子项恢复
    kind: page
    expectedStablePageKey: messages.special_follow.settings
    requiredSemanticAssertions: [短信/电话提醒开关恢复蓝色开启状态；独立间隔时间、提醒方式、夜间免打扰和22:00至次日06:00说明恢复显示。]
