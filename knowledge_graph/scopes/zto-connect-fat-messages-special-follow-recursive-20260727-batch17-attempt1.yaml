expectedStates:
  - key: messages.special_follow.settings.transient_help_tolerant
    label: 特别关注提醒设置页当前状态
    kind: page
    expectedStablePageKey: messages.special_follow.settings
    requiredSemanticAssertions:
      - 页面顶部标题文字为“特别关注提醒”，“间隔时间”行和当前值“10”可见。
    inspection:
      queryPrompt: 完整盘点“特别关注提醒”当前视口全部交互控件与状态；帮助气泡如仍显示则如实记录，准确定位“间隔时间”整行入口。
      locateAllInteractiveControls: true
      includeControlTypes: [button, icon_button, link, menu, list_entry, toggle, checkbox, radio, segmented_control, tab, slider, stepper, input, back, close, scroll_region]
      requireScrollCoverage: false
    allowedActions: [open_reminder_interval]
    postcondition: 当前设置页完成盘点。
  - key: messages.special_follow.settings.reminder_interval
    label: 提醒间隔时间选项页
    kind: page
    expectedStablePageKey: messages.special_follow.settings.reminder_interval
    requiredSemanticAssertions:
      - 当前屏幕显示由“间隔时间”行打开的独立时间选项页，至少一个可选时间值可见。
    inspection:
      queryPrompt: 完整盘点间隔时间选项页的标题、返回与关闭控件、全部可见时间值、当前选中标记、单位和真实可辨滚动区域；逐项定位所有选项。
      locateAllInteractiveControls: true
      includeControlTypes: [button, icon_button, link, menu, list_entry, toggle, checkbox, radio, segmented_control, tab, slider, stepper, input, back, close, scroll_region]
      requireScrollCoverage: true
    allowedActions: []
    postcondition: 已记录间隔时间页的全部可见选项和当前选中态。

actions:
  - id: capture-settings-before-reminder-interval
    kind: capture
    state: messages.special_follow.settings.transient_help_tolerant
    depth: 2
  - id: open-reminder-interval
    kind: tap
    semanticAction: open_reminder_interval
    fromState: messages.special_follow.settings.transient_help_tolerant
    toState: messages.special_follow.settings.reminder_interval
    depth: 3
    risk: low
    sideEffects: [navigation_history]
    waitMs: 2200
    target:
      key: reminder_interval
      label: 间隔时间
      scope: settings_navigation
      locatorPrompt: 定位“特别关注提醒”页左侧文字“间隔时间”、右侧显示当前值“10”和向右箭头的整行入口。
      allowedRegionRef: reminder-interval-row
    postcondition:
      expectedForegroundPackage: com.zto.connect.fat
      requiredScreenshotChange: true
      semanticAssertions:
        - 当前屏幕已离开“特别关注提醒”主设置页，显示由“间隔时间”打开的时间选项页面，至少一个数值选项可见。

