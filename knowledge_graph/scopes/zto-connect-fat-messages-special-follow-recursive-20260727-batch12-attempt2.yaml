expectedStates:
  - key: messages.special_follow.people.empty
    label: 全部成员空白状态
    kind: page
    expectedStablePageKey: messages.special_follow.people
    requiredSemanticAssertions:
      - 当前屏幕标题为“全部成员”，左侧返回箭头和右侧关闭 X 均可见，标题栏下方主体为空白。
    inspection:
      queryPrompt: 盘点“全部成员”页面当前视口的全部图标、按键、返回和关闭控件；主体为空白时如实记录，不推断名单不存在、加载状态或业务原因。
      locateAllInteractiveControls: true
      includeControlTypes: [button, icon_button, link, menu, list_entry, toggle, checkbox, radio, segmented_control, tab, slider, stepper, input, back, close, scroll_region]
      requireScrollCoverage: false
    allowedActions: [close_current_page]
    postcondition: 全部成员空白页面完成全控件盘点。
  - key: messages.special_follow.people.close_result
    label: 关闭全部成员后的实际返回页
    kind: page
    expectedStablePageKey: messages.special_follow.close_result
    requiredSemanticAssertions:
      - 当前“全部成员”页面已关闭且不再显示，宝盒测试包仍保持前台；准确识别并记录实际返回页面，不预设目标。
    inspection:
      queryPrompt: 完整盘点关闭“全部成员”后的实际页面，识别页面标题、主要内容和全部可见交互控件；以当前画面为准，不根据导航历史猜测页面。
      locateAllInteractiveControls: true
      includeControlTypes: [button, icon_button, link, menu, list_entry, toggle, checkbox, radio, segmented_control, tab, slider, stepper, input, back, close, scroll_region]
      requireScrollCoverage: false
    allowedActions: []
    postcondition: 已记录右上关闭 X 的真实导航结果。

actions:
  - id: capture-all-members-empty-before-close
    kind: capture
    state: messages.special_follow.people.empty
    depth: 3
  - id: close-all-members
    kind: tap
    semanticAction: close_current_page
    fromState: messages.special_follow.people.empty
    toState: messages.special_follow.people.close_result
    depth: 3
    risk: safe
    sideEffects: [navigation_history]
    waitMs: 2500
    target:
      key: all_members_close
      label: 右上关闭 X
      scope: page_navigation
      locatorPrompt: 定位标题为“全部成员”的页面顶栏最右侧黑色 X 形关闭图标；只定位关闭 X，不要定位左侧返回箭头。
      allowedRegionRef: app-visible-content
    postcondition:
      expectedForegroundPackage: com.zto.connect.fat
      requiredScreenshotChange: true
      semanticAssertions:
        - 当前“全部成员”页面已关闭且不再显示，宝盒测试包仍保持前台；准确识别并记录实际返回页面。

