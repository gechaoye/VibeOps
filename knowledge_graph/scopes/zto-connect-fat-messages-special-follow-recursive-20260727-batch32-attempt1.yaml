expectedStates:
  - key: messages.special_follow.settings.dnd.both_off
    label: 两个免打扰开关均关闭
    kind: page
    expectedStablePageKey: messages.special_follow.settings
    requiredSemanticAssertions: [页面标题为“特别关注提醒”；夜间免打扰与免打扰群通知开关均为灰色关闭状态。]
    inspection: &settingsInspection
      queryPrompt: 完整盘点当前视口中拥有完整点击区域的交互控件，准确记录两个免打扰开关状态；底边裁切行只记录为内容。
      locateAllInteractiveControls: true
      includeControlTypes: [button, icon_button, list_entry, toggle, back, close, scroll_region]
      requireScrollCoverage: false
    allowedActions: [enable_night_dnd]
    postcondition: 已记录两个开关均关闭。
  - key: messages.special_follow.settings.dnd.night_on
    label: 夜间免打扰开启
    kind: page
    expectedStablePageKey: messages.special_follow.settings
    requiredSemanticAssertions: [夜间免打扰开关为蓝色开启状态；免打扰群通知仍为灰色关闭状态；22:00至次日06:00说明仍可见。]
    inspection: *settingsInspection
    allowedActions: [disable_night_dnd]
    postcondition: 已验证夜间免打扰开启。
  - key: messages.special_follow.settings.dnd.night_off_again
    label: 夜间免打扰重新关闭
    kind: page
    expectedStablePageKey: messages.special_follow.settings
    requiredSemanticAssertions: [夜间免打扰开关恢复灰色关闭状态；免打扰群通知仍为灰色关闭状态。]
    inspection: *settingsInspection
    allowedActions: [enable_group_dnd]
    postcondition: 已验证夜间免打扰关闭。
  - key: messages.special_follow.settings.dnd.group_on
    label: 免打扰群通知开启
    kind: page
    expectedStablePageKey: messages.special_follow.settings
    requiredSemanticAssertions: [免打扰群通知开关为蓝色开启状态；夜间免打扰为灰色关闭状态。]
    inspection: *settingsInspection
    allowedActions: [disable_group_dnd]
    postcondition: 已验证免打扰群通知开启。
  - key: messages.special_follow.settings.dnd.both_off_final
    label: 两个免打扰开关最终关闭
    kind: page
    expectedStablePageKey: messages.special_follow.settings
    requiredSemanticAssertions: [夜间免打扰与免打扰群通知开关均为灰色关闭状态。]
    inspection: *settingsInspection
    allowedActions: []
    postcondition: 已验证免打扰群通知关闭。

