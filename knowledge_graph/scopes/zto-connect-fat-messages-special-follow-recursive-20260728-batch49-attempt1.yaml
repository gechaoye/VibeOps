    expectedStablePageKey: messages.special_follow.settings
    requiredSemanticAssertions: [当前页面标题为特别关注提醒，短信/电话提醒开关开启，其下第二个间隔时间显示30分钟。]
    inspection: &settingsInspection
      queryPrompt: 本状态帧只输出当前为特别关注提醒页、短信/电话提醒开关开启以及其下第二个间隔时间的当前值，visibleControls 必须返回空数组；间隔时间由动作步骤单独实时 aiLocate。
      locateAllInteractiveControls: true
      includeControlTypes: [button]
      requireScrollCoverage: false
    allowedActions: [open_sms_phone_interval_selector_30]
    postcondition: 已验证返回后的短信电话提醒间隔为30分钟。
  - key: messages.special_follow.settings.sms_phone_reminder.interval.selector_30_before_select_10
    label: 选择十分钟前的短信电话间隔面板
    kind: dialog
    expectedStablePageKey: messages.special_follow.settings.sms_phone_reminder.interval
    requiredSemanticAssertions: [底部面板显示10分钟、30分钟和取消，30分钟为当前选中项。]
    inspection: &panelInspection
      queryPrompt: 完整盘点底部面板的10分钟、30分钟和取消；背景页控件只记录为被遮罩内容，不作为当前可操作控件。
      locateAllInteractiveControls: true
      includeControlTypes: [button, list_entry, radio, close]
      requireScrollCoverage: false
    allowedActions: [select_sms_phone_interval_10]
    postcondition: 已记录选择10分钟前的面板状态。
  - key: messages.special_follow.settings.sms_phone_reminder.interval_10_selected
    label: 已选择短信电话间隔十分钟的设置页
    kind: page
    expectedStablePageKey: messages.special_follow.settings
    requiredSemanticAssertions: [底部面板已关闭，短信/电话提醒开关下方第二个间隔时间显示10分钟。]
    inspection: *settingsInspection
    allowedActions: [open_sms_phone_interval_selector_10]
    postcondition: 已验证实际选择10分钟并更新设置值。
  - key: messages.special_follow.settings.sms_phone_reminder.interval.selector_10_selected
