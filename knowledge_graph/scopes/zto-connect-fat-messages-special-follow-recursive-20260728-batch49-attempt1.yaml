expectedStates:
  - key: messages.special_follow.people.nonempty_for_interval_return
    label: 返回设置前的全部成员非空页
    kind: page
    expectedStablePageKey: messages.special_follow.people
    requiredSemanticAssertions: [当前页面标题为全部成员，左上返回、右上关闭、成员头像姓名和右侧移除按钮可见。]
    inspection:
      queryPrompt: 本状态帧只输出当前为非空全部成员页以及返回、关闭、成员和移除可见的事实，visibleControls 必须返回空数组；本批通过 AndroidAgent back 返回上一页。
      locateAllInteractiveControls: true
      includeControlTypes: [button]
      requireScrollCoverage: false
    allowedActions: [navigate_back]
    postcondition: 已记录返回设置前的全部成员页。
