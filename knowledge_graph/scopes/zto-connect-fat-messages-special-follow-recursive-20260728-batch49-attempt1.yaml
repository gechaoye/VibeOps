    requiredSemanticAssertions: [底部面板已关闭，短信/电话提醒开关下方第二个间隔时间显示30分钟。]
    inspection: *settingsInspection
    allowedActions: []
    postcondition: 已验证再次选择30分钟并更新设置值。

