      locateAllInteractiveControls: true
      includeControlTypes: [button, icon_button, link, menu, list_entry, toggle, checkbox, radio, segmented_control, tab, slider, stepper, input, back, close, scroll_region]
      requireScrollCoverage: false
    allowedActions: []
    postcondition: 已验证首页蓝色“设置”进入特别关注提醒设置页。

actions:
  - id: capture-special-follow-home-nonempty
    kind: capture
    state: messages.special_follow.home.nonempty
    depth: 1
  - id: open-special-follow-settings-from-home
    kind: tap
    semanticAction: open_special_follow_settings
    fromState: messages.special_follow.home.nonempty
    toState: messages.special_follow.settings.from_home
    depth: 2
    risk: safe
