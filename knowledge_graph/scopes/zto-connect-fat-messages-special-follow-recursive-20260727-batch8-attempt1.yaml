      space: current_display_px
      rect: {x: 970, y: 245, width: 182, height: 170}
      purpose: 非空“我的特别关注 1人”行右侧进入箭头的实时 Midscene 定位范围。
    - key: app-visible-content
      space: current_display_px
      rect: {x: 0, y: 96, width: 1152, height: 2184}
      purpose: 经用户授权和风险策略允许的特别关注功能内控件范围。

expectedStates:
  - key: messages.special_follow.settings.with_member
    label: 添加成员后的特别关注提醒设置
    kind: page
    expectedStablePageKey: messages.special_follow.settings
    requiredSemanticAssertions:
      - 当前屏幕标题为“特别关注提醒”，“我的特别关注”显示“1人”，成员“练良伟”、添加和移除均可见。
    inspection:
      queryPrompt: 完整盘点添加成员后的“特别关注提醒”设置页，记录成员“练良伟”、添加、移除、全部帮助图标、开关、间隔时间、提示音和返回控件。
      locateAllInteractiveControls: true
      includeControlTypes: [button, icon_button, link, menu, list_entry, toggle, checkbox, radio, segmented_control, tab, slider, stepper, input, back, close, scroll_region]
      requireScrollCoverage: false
    allowedActions: [open_nonempty_special_following_list]
    postcondition: 非空设置页完成盘点。
  - key: messages.special_follow.people.nonempty
    label: 全部成员非空状态
    kind: page
    expectedStablePageKey: messages.special_follow.people
    requiredSemanticAssertions:
      - 当前屏幕标题为“全部成员”，左侧返回箭头和右侧关闭 X 可见，成员“练良伟”显示在页面主体中。
    inspection:
      queryPrompt: 完整盘点特别关注“全部成员”非空页面的成员条目、头像、姓名、可能的操作、返回、关闭和真实可辨滚动区域；记录但不猜测成员点击后的目标。
      locateAllInteractiveControls: true
      includeControlTypes: [button, icon_button, link, menu, list_entry, toggle, checkbox, radio, segmented_control, tab, slider, stepper, input, back, close, scroll_region]
      requireScrollCoverage: true
    allowedActions: [open_special_follow_member, navigate_back, close]
    postcondition: 全部成员非空页面完成全控件盘点。

actions:
  - id: capture-special-follow-settings-with-member
    kind: capture
    state: messages.special_follow.settings.with_member
    depth: 2
  - id: open-nonempty-special-follow-members
    kind: tap
    semanticAction: open_nonempty_special_following_list
    fromState: messages.special_follow.settings.with_member
    toState: messages.special_follow.people.nonempty
    depth: 3
    risk: low
    sideEffects: [navigation_history]
    waitMs: 3000
    target:
      key: special_follow_members_chevron
      label: 我的特别关注右侧进入箭头
      scope: settings_navigation
      locatorPrompt: 定位“特别关注提醒”页面“我的特别关注”同一行最右侧、显示“1人”右边的黑色向右尖括号进入箭头；只定位箭头。
      allowedRegionRef: special-follow-members-chevron
    postcondition:
      expectedForegroundPackage: com.zto.connect.fat
      requiredScreenshotChange: true
      semanticAssertions:
        - 当前屏幕标题为“全部成员”，左侧返回箭头、右侧关闭 X 和成员“练良伟”均可见。

