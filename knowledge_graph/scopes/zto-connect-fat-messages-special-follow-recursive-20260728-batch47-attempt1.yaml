title: 特别关注动态未读与消息页橙黄爱心第四十七批第一次采集

target:
  platform: android
  applicationKey: zto.connect
  packageId: com.zto.connect.fat
  featureOrPage: 消息页顶部工具栏“特别关注”入口（爱心图标）及入口下全部内容
  userIntent: 从特别关注设置返回未读会话状态，再收起到消息页，验证特别关注入口爱心的橙黄色高亮状态。
  environment: fat
  knownFacts:
    - {subjectKey: messages.toolbar.heart, predicate: function_name, value: 特别关注, source: user}
    - {subjectKey: messages.special_follow.unread_badge, predicate: value_semantics, value: 红色角标展示特别关注会话当前实时未读消息数量；具体数字是 Runtime 呈现，不属于稳定身份或固定规则。, source: user}
    - {subjectKey: messages.special_follow.member_with_unread, predicate: conversation_visibility, value: 设置为特别关注的人员存在未读消息时，该人员的会话显示在特别关注列表。, source: user}
    - {subjectKey: messages.toolbar.heart, predicate: unread_highlight_condition, value: 已设置的特别关注人员存在未读消息并在特别关注列表展示会话时，消息页入口爱心图标变为橙黄色。, source: user}

