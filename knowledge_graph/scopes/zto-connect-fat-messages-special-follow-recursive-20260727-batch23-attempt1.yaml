    semanticAction: enable_popup_reminder
    fromState: messages.special_follow.settings.popup_reminder.off
    toState: messages.special_follow.settings.popup_reminder.on_again
    depth: 3
    risk: medium
    sideEffects: [persistent_setting_change]
    waitMs: 1800
    target:
      key: single_chat_popup_toggle
      label: 单聊消息未读，弹窗提醒我
      scope: persistent_setting_control
      locatorPrompt: 定位“单聊消息未读，弹窗提醒我”这一行最右侧的灰色关闭开关；不要定位旁边的圆圈问号图标。
      allowedRegionRef: popup-reminder-toggle-region
    postcondition:
      expectedForegroundPackage: com.zto.connect.fat
      requiredScreenshotChange: true
      semanticAssertions:
        - 单聊消息未读弹窗提醒开关已恢复为蓝色开启状态，准确记录关联设置当前呈现。

