expectedStates:
  - key: messages.special_follow.settings.popup_reminder.on
    label: 单聊未读弹窗提醒开启状态
    kind: page
    expectedStablePageKey: messages.special_follow.settings
    requiredSemanticAssertions:
      - 页面标题为“特别关注提醒”，“单聊消息未读，弹窗提醒我”开关为蓝色开启状态。
    inspection:
      queryPrompt: 完整盘点设置页全部可见控件和当前设置状态，重点记录单聊未读弹窗提醒为开启，以及间隔时间和短信/电话提醒当前呈现。
      locateAllInteractiveControls: true
      includeControlTypes: [button, icon_button, list_entry, toggle, back, close, scroll_region]
      requireScrollCoverage: false
    allowedActions: [disable_popup_reminder]
    postcondition: 已记录单聊未读弹窗提醒开启状态。
  - key: messages.special_follow.settings.popup_reminder.off
    label: 单聊未读弹窗提醒关闭状态
    kind: page
    expectedStablePageKey: messages.special_follow.settings
    requiredSemanticAssertions:
      - 页面仍为“特别关注提醒”，“单聊消息未读，弹窗提醒我”开关为灰色关闭状态。
    inspection:
      queryPrompt: 完整盘点关闭单聊未读弹窗提醒后的设置页全部控件；准确记录间隔时间、短信/电话提醒及其他设置是隐藏、禁用还是保持，不根据依赖关系猜测。
      locateAllInteractiveControls: true
      includeControlTypes: [button, icon_button, list_entry, toggle, back, close, scroll_region]
      requireScrollCoverage: false
    allowedActions: [enable_popup_reminder]
    postcondition: 已记录关闭状态及所有关联设置的真实呈现。
  - key: messages.special_follow.settings.popup_reminder.on_again
    label: 单聊未读弹窗提醒再次开启状态
    kind: page
    expectedStablePageKey: messages.special_follow.settings
    requiredSemanticAssertions:
      - 页面仍为“特别关注提醒”，“单聊消息未读，弹窗提醒我”开关恢复为蓝色开启状态。
    inspection:
      queryPrompt: 完整盘点再次开启单聊未读弹窗提醒后的设置页全部控件，记录关联设置是否恢复及其当前值。
      locateAllInteractiveControls: true
      includeControlTypes: [button, icon_button, list_entry, toggle, back, close, scroll_region]
      requireScrollCoverage: false
    allowedActions: []
    postcondition: 已验证该开关可关闭并再次开启。

