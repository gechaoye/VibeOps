execution:
  framework: midscene
  requireSemanticLocator: true
  requireSemanticPostconditions: true
  defaultWaitMs: 2500
  allowedTargetScopes: [feature_entry, page_navigation, page_content, settings_navigation, temporary_state_control, scroll_region]
  allowedTapRegions:
    - key: special-follow-member-row
      space: current_display_px
      rect: {x: 0, y: 250, width: 930, height: 230}
      purpose: 成员“练良伟”展示条目的实时 Midscene 定位范围，不含移除按钮。
    - key: remove-special-follow-member
      space: current_display_px
      rect: {x: 930, y: 250, width: 222, height: 230}
      purpose: 成员“练良伟”行右侧“移除”按钮的实时 Midscene 定位范围。
    - key: app-visible-content
      space: current_display_px
      rect: {x: 0, y: 96, width: 1152, height: 2184}
      purpose: 经用户授权和风险策略允许的特别关注功能内控件范围。

expectedStates:
  - key: messages.special_follow.people.nonempty
    label: 全部成员非空状态
    kind: page
    expectedStablePageKey: messages.special_follow.people
    requiredSemanticAssertions:
      - 当前屏幕标题为“全部成员”，成员“练良伟”和“移除”按钮可见。
    inspection:
      queryPrompt: 盘点返回、关闭、成员“练良伟”和移除按钮。
      locateAllInteractiveControls: true
      includeControlTypes: [button, list_entry, back, close]
      requireScrollCoverage: false
    allowedActions: [verify_member_display_no_navigation]
    postcondition: 非空成员列表完成盘点。
  - key: messages.special_follow.people.after_member_tap
    label: 点击成员展示条目后仍停留列表
    kind: page
    expectedStablePageKey: messages.special_follow.people
    requiredSemanticAssertions:
      - 当前屏幕仍为标题“全部成员”的同一页面，成员“练良伟”和“移除”按钮仍可见，没有打开个人资料或其他页面。
    inspection:
      queryPrompt: 复核成员展示条目点击后的同页状态，定位返回、关闭、成员和移除按钮。
      locateAllInteractiveControls: true
      includeControlTypes: [button, list_entry, back, close]
      requireScrollCoverage: false
    allowedActions: [remove_special_follow_member]
    postcondition: 已验证成员条目点击无导航。
  - key: messages.special_follow.people.after_remove_trigger
    label: 点击移除后的结果状态
    kind: page
    expectedStablePageKey: messages.special_follow.people
    requiredSemanticAssertions:
      - 点击“移除”后，当前屏幕出现与移除成员“练良伟”有关的确认状态，或者“全部成员”列表中已不再显示该成员。
    inspection:
      queryPrompt: 完整盘点点击移除后的可见状态；如有确认弹窗，定位标题、说明、取消、确认和关闭控件；如已立即移除，记录空白列表及返回/关闭控件。
      locateAllInteractiveControls: true
      includeControlTypes: [button, icon_button, link, menu, list_entry, back, close]
      requireScrollCoverage: false
    allowedActions: [confirm_remove, cancel_remove, navigate_back, close]
    postcondition: 已识别移除流程下一步或立即移除结果。

actions:
  - id: capture-members-before-noop-and-remove
    kind: capture
    state: messages.special_follow.people.nonempty
    depth: 3
  - id: verify-member-row-no-navigation
    kind: tap
    semanticAction: verify_member_display_no_navigation
    fromState: messages.special_follow.people.nonempty
    toState: messages.special_follow.people.after_member_tap
    depth: 3
    risk: low
    sideEffects: [temporary_display_state]
    waitMs: 1500
    target:
      key: member_lian_liangwei
      label: 练良伟
      scope: page_content
      locatorPrompt: 定位“全部成员”页面唯一成员条目左侧头像和姓名“练良伟”所在区域；不要定位右侧移除按钮。
      allowedRegionRef: special-follow-member-row
    postcondition:
      expectedForegroundPackage: com.zto.connect.fat
      requiredScreenshotChange: false
      semanticAssertions:
        - 当前屏幕仍为标题“全部成员”的同一页面，成员“练良伟”和“移除”按钮仍可见，没有打开其他页面。
  - id: trigger-remove-special-follow-member
    kind: tap
    semanticAction: remove_special_follow_member
    fromState: messages.special_follow.people.after_member_tap
    toState: messages.special_follow.people.after_remove_trigger
    depth: 3
    risk: medium
    sideEffects: [persistent_setting_change]
    waitMs: 2500
    target:
      key: remove_member_lian_liangwei
      label: 移除
      scope: settings_navigation
      locatorPrompt: 定位“全部成员”页面成员“练良伟”所在行最右侧、浅灰描边且文字为“移除”的按钮。
      allowedRegionRef: remove-special-follow-member
    postcondition:
      expectedForegroundPackage: com.zto.connect.fat
      requiredScreenshotChange: true
      semanticAssertions:
        - 点击“移除”后，当前屏幕出现与移除成员“练良伟”有关的确认状态，或者列表中已不再显示该成员。

