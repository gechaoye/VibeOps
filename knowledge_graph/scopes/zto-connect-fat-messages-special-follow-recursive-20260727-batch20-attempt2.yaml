expectedStates:
  - key: messages.special_follow.settings.sound.selector
    label: 特别关注提示音选择面板
    kind: dialog
    expectedStablePageKey: messages.special_follow.settings.sound
    requiredSemanticAssertions:
      - 底部提示音面板显示“默认”“波浪”“简报”“门铃”和“取消”，“波浪”为蓝色对勾选中。
    inspection:
      queryPrompt: 完整盘点四个单选项、四个试听按钮、“取消”和被遮罩背景页控件；半透明背景遮罩没有可见按钮标识且点击行为未验证，只记录为呈现，不要返回为交互控件或滚动区域。
      locateAllInteractiveControls: true
      includeControlTypes: [button, icon_button, list_entry, toggle, radio, back, close]
      requireScrollCoverage: false
    allowedActions: [select_sound_briefing]
    postcondition: 提示音面板完成全控件盘点。
  - key: messages.special_follow.settings.sound.briefing
    label: 提示音更新为简报
    kind: page
    expectedStablePageKey: messages.special_follow.settings
    requiredSemanticAssertions:
      - 提示音面板已经关闭，页面顶部标题为“特别关注提醒”，“特别关注提示音”行右侧值为“简报”。
    inspection:
      queryPrompt: 完整盘点选择简报后的“特别关注提醒”页全部交互控件和设置状态，确认提示音面板关闭且当前提示音值为简报。
      locateAllInteractiveControls: true
      includeControlTypes: [button, icon_button, list_entry, toggle, back, close, scroll_region]
      requireScrollCoverage: false
    allowedActions: []
    postcondition: 已验证选择简报会关闭面板并更新主设置值。

actions:
  - id: capture-sound-picker
    kind: capture
    state: messages.special_follow.settings.sound.selector
    depth: 3
  - id: select-sound-briefing
    kind: tap
    semanticAction: select_sound_briefing
    fromState: messages.special_follow.settings.sound.selector
    toState: messages.special_follow.settings.sound.briefing
    depth: 3
    risk: medium
    sideEffects: [persistent_setting_change]
    waitMs: 1800
    target:
      key: sound_briefing
      label: 简报
      scope: persistent_setting_control
      locatorPrompt: 定位提示音底部面板中从上往下第三行、左侧文字为“简报”的单选项主体；不要定位该行右侧的圆形播放按钮。
      allowedRegionRef: sound-picker-panel
    postcondition:
      expectedForegroundPackage: com.zto.connect.fat
      requiredScreenshotChange: true
      semanticAssertions:
        - 提示音面板已关闭，“特别关注提醒”页“特别关注提示音”行右侧显示“简报”。

