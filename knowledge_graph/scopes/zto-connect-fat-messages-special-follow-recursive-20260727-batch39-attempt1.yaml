  - id: tap-settings-back
    kind: tap
    semanticAction: back_to_special_follow
    fromState: messages.special_follow.settings.sound.bell
    toState: messages.special_follow.empty_returned
    depth: 2
    risk: safe
    sideEffects: [navigation_history]
    waitMs: 2500
    target: {key: settings_back, label: 返回, scope: page_navigation, locatorPrompt: 定位标题为“特别关注提醒”的页面顶栏最左侧黑色向左箭头返回按钮。, allowedRegionRef: settings-back-region}
    postcondition: {expectedForegroundPackage: com.zto.connect.fat, requiredScreenshotChange: true, semanticAssertions: [当前页面已返回标题为特别关注的空状态页，设置特别关注入口可见。]}
  - id: tap-special-follow-back
    kind: tap
    semanticAction: back_to_messages
    fromState: messages.special_follow.empty_returned
    toState: messages.root.returned_from_special_follow
    depth: 1
    risk: safe
    sideEffects: [navigation_history]
    waitMs: 2500
    target: {key: special_follow_back, label: 返回, scope: page_navigation, locatorPrompt: 定位标题为“特别关注”的页面顶栏最左侧黑色向左箭头返回按钮。, allowedRegionRef: special-follow-back-region}
    postcondition: {expectedForegroundPackage: com.zto.connect.fat, requiredScreenshotChange: true, semanticAssertions: [当前已返回消息页，底部消息Tab已选中，会话列表和顶部快捷工具栏可见。]}

