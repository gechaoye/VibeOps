expectedStates:
  - key: messages.special_follow.settings.sound.bell
    label: 特别关注提醒设置页门铃状态
    kind: page
    expectedStablePageKey: messages.special_follow.settings
    requiredSemanticAssertions: [当前页面标题为特别关注提醒，左上返回按钮可见，特别关注提示音当前为门铃。]
    inspection: &settingsInspection
      queryPrompt: 完整盘点当前视口中拥有完整点击区域的交互控件，准确定位顶栏左上返回按钮；被边界裁切的内容只记录为内容。
      locateAllInteractiveControls: true
      includeControlTypes: [button, icon_button, list_entry, toggle, back, close, scroll_region]
      requireScrollCoverage: false
    allowedActions: [back_to_special_follow]
    postcondition: 已记录设置页返回前状态。
  - key: messages.special_follow.empty_returned
    label: 返回特别关注空状态页
    kind: page
    expectedStablePageKey: messages.special_follow
    requiredSemanticAssertions: [当前页面标题为特别关注，空状态说明和设置特别关注入口可见，左上返回按钮可见。]
    inspection:
      queryPrompt: 完整盘点返回后的特别关注页面，包括标题、空状态、设置特别关注入口、顶栏左上返回按钮和其他全部可见交互控件。
      locateAllInteractiveControls: true
      includeControlTypes: [button, icon_button, link, list_entry, back, close, scroll_region]
      requireScrollCoverage: false
    allowedActions: [back_to_messages]
    postcondition: 已验证设置页返回特别关注页。
  - key: messages.root.returned_from_special_follow
    label: 返回消息页
    kind: page
    expectedStablePageKey: messages.root
    requiredSemanticAssertions: [当前底部消息Tab已选中，会话列表和顶部快捷工具栏可见，特别关注爱心入口可见。]
    inspection:
      queryPrompt: 完整盘点返回后的消息页全部可见交互控件，用户确认顶部快捷工具栏爱心图标为特别关注入口；如实记录其当前颜色和未读呈现，不根据已添加成员推断变色。
      locateAllInteractiveControls: true
      includeControlTypes: [button, icon_button, list_entry, tab, menu, close, scroll_region]
      requireScrollCoverage: false
    allowedActions: []
    postcondition: 已验证特别关注页返回消息页。

actions:
