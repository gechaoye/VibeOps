      includeControlTypes: [button, icon_button, list_entry, toggle, back, close, scroll_region]
      requireScrollCoverage: false
    allowedActions: [enable_sms_phone_reminder]
    postcondition: 已记录短信电话提醒关闭状态。
  - key: messages.special_follow.settings.sms_phone_reminder.activation_result
    label: 激活短信电话提醒后的实际状态
    kind: unresolved
    expectedStablePageKey: messages.special_follow.settings
    requiredSemanticAssertions:
      - 宝盒测试包仍在前台；准确记录“弹窗消息未读，短信/电话提醒我”开关是否开启，或是否出现新的 APP 内提示、弹层或页面，不预设结果。
    inspection:
      queryPrompt: 完整盘点点击短信/电话提醒开关后的整个画面，准确识别开关状态及任何新弹层、提示、按钮和说明；不要根据预期猜测开启是否成功。
      locateAllInteractiveControls: true
      includeControlTypes: [button, icon_button, list_entry, toggle, back, close, dialog]
      requireScrollCoverage: false
    allowedActions: []
    postcondition: 已记录短信电话提醒激活操作的真实结果和全部新增控件。

