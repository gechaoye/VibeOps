    - key: app-visible-content
      space: current_display_px
      rect: {x: 0, y: 96, width: 1152, height: 2184}
      purpose: 经用户授权和风险策略允许的特别关注功能内控件范围。

expectedStates:
  - key: messages.special_follow.people.nonempty
    label: 全部成员非空状态
    kind: page
    expectedStablePageKey: messages.special_follow.people
    requiredSemanticAssertions:
      - 当前屏幕标题为“全部成员”，成员“练良伟”和其右侧“移除”按钮可见。
    inspection:
      queryPrompt: 完整盘点特别关注“全部成员”非空页面的返回、关闭、成员“练良伟”和移除按钮。
      locateAllInteractiveControls: true
      includeControlTypes: [button, icon_button, list_entry, back, close, scroll_region]
      requireScrollCoverage: false
    allowedActions: [open_special_follow_member]
    postcondition: 非空成员列表完成盘点。
  - key: boundary.common.person_profile.lian_liangwei
    label: 练良伟成员点击目标
    kind: page
    expectedStablePageKey: boundary.common.person_profile
    requiredSemanticAssertions:
      - 当前屏幕已离开“全部成员”列表，并显示与“练良伟”相关的个人信息、资料、名片或详情内容。
    inspection:
      queryPrompt: 该页面若为 APP 通用个人资料组件，只盘点返回/关闭和能确认组件身份的主要信息，不递归探索组件内部功能；如点击无导航则如实记录。
      locateAllInteractiveControls: true
      includeControlTypes: [button, icon_button, link, menu, list_entry, back, close, scroll_region]
      requireScrollCoverage: false
    allowedActions: [navigate_back]
    postcondition: 成员条目目标已确认并作为通用组件边界记录。
  - key: messages.special_follow.people.returned_from_profile
    label: 从成员目标返回全部成员
    kind: page
    expectedStablePageKey: messages.special_follow.people
    requiredSemanticAssertions:
      - 当前屏幕已返回标题为“全部成员”的页面，成员“练良伟”和“移除”按钮可见。
    inspection:
      queryPrompt: 复核返回后的全部成员页，定位返回、关闭、成员“练良伟”和移除按钮。
      locateAllInteractiveControls: true
      includeControlTypes: [button, list_entry, back, close]
      requireScrollCoverage: false
    allowedActions: []
    postcondition: 已验证从成员目标返回全部成员。

actions:
  - id: capture-nonempty-members-before-member-entry
    kind: capture
    state: messages.special_follow.people.nonempty
    depth: 3
  - id: open-special-follow-member
    kind: tap
    semanticAction: open_special_follow_member
    fromState: messages.special_follow.people.nonempty
    toState: boundary.common.person_profile.lian_liangwei
    depth: 4
    risk: low
    sideEffects: [navigation_history]
    waitMs: 3000
    target:
      key: member_lian_liangwei
      label: 练良伟
      scope: page_navigation
      locatorPrompt: 定位“全部成员”标题下方唯一成员条目左侧头像和中部姓名“练良伟”组成的行；不要定位最右侧“移除”按钮。
      allowedRegionRef: special-follow-member-row
    postcondition:
      expectedForegroundPackage: com.zto.connect.fat
      requiredScreenshotChange: true
      semanticAssertions:
        - 当前屏幕已离开“全部成员”列表，并显示与“练良伟”相关的个人信息、资料、名片或详情内容。
  - id: back-from-special-follow-member-target
    kind: back
    semanticAction: navigate_back
    fromState: boundary.common.person_profile.lian_liangwei
    toState: messages.special_follow.people.returned_from_profile
    depth: 3
    risk: safe
    sideEffects: [navigation_history]
    waitMs: 2500
    postcondition:
      expectedForegroundPackage: com.zto.connect.fat
      requiredScreenshotChange: true
      semanticAssertions:
        - 当前屏幕已返回标题为“全部成员”的页面，成员“练良伟”和“移除”按钮可见。

