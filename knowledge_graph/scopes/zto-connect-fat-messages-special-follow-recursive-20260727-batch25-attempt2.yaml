expectedStates:
  - key: messages.special_follow.settings.sms_phone_reminder.on
    label: 短信电话提醒开启扩展设置页
    kind: page
    expectedStablePageKey: messages.special_follow.settings
    requiredSemanticAssertions:
      - 页面标题为“特别关注提醒”，短信/电话提醒开关为蓝色开启状态。
      - 短信/电话提醒开关下方可见“间隔时间 30分钟”“提醒方式 短信”和“夜间免打扰”。
    inspection:
      queryPrompt: 完整盘点当前视口中拥有完整可见点击区域的全部交互控件，区分两个同名间隔时间入口。屏幕底边只露出一部分且点击区域被裁切的“特别关注提示音”行记录到页面内容，不作为本 Frame 可操作控件返回；该行已有其他完整 Frame 证据。
      locateAllInteractiveControls: true
      includeControlTypes: [button, icon_button, list_entry, toggle, back, close, scroll_region]
      requireScrollCoverage: false
    allowedActions: [open_sms_phone_interval_selector]
    postcondition: 已记录当前视口内完整可操作的短信电话提醒扩展设置。
  - key: messages.special_follow.settings.sms_phone_reminder.interval.selector
    label: 短信电话提醒间隔选择面板
    kind: dialog
    expectedStablePageKey: messages.special_follow.settings.sms_phone_reminder.interval
    requiredSemanticAssertions:
      - 已打开来自短信/电话提醒分区第二个“间隔时间”的底部选项面板，完整准确记录全部选项、选中态和取消。
    inspection:
      queryPrompt: 完整盘点底部间隔时间面板的全部可见选项、当前选中项、取消按钮及滚动性；背景遮罩只记录为呈现，不作为交互控件。背景中被屏幕边缘裁切的控件不作为当前可操作控件返回。
      locateAllInteractiveControls: true
      includeControlTypes: [button, list_entry, radio, close, scroll_region]
      requireScrollCoverage: false
    allowedActions: []
    postcondition: 已记录短信电话提醒间隔面板的全部内容，后续选项进入递归队列。

