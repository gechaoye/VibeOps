    waitMs: 1800
    target:
      key: sms_phone_interval
      label: 短信电话提醒下的间隔时间 30分钟
      scope: settings_navigation
      locatorPrompt: 定位蓝色开启的“弹窗消息未读，短信/电话提醒我”开关正下方、左侧为“间隔时间”、右侧显示“30分钟”和右箭头的第二个间隔时间整行；不要定位页面上方第一个间隔时间。
      allowedRegionRef: sms-phone-settings-content
    postcondition:
      expectedForegroundPackage: com.zto.connect.fat
      requiredScreenshotChange: true
      semanticAssertions:
        - 短信/电话提醒分区第二个间隔时间的底部选项面板已打开，完整记录全部选项和当前选中项。

