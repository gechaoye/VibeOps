      space: current_display_px
      rect: {x: 0, y: 1580, width: 1152, height: 230}
      purpose: “特别关注提示音”整行入口的实时 Midscene 定位范围。
    - key: app-visible-content
      space: current_display_px
      rect: {x: 0, y: 96, width: 1152, height: 2184}
      purpose: 经风险策略允许的应用内导航、临时状态和已授权持久设置控件范围。

expectedStates:
  - key: messages.special_follow.settings.interval_30
    label: 特别关注提醒设置页三十分钟状态
    kind: page
    expectedStablePageKey: messages.special_follow.settings
    requiredSemanticAssertions:
      - 页面顶部标题文字为“特别关注提醒”，“间隔时间”值为“30分钟”，“特别关注提示音”值为“波浪”。
    inspection:
      queryPrompt: 完整盘点“特别关注提醒”当前视口全部交互控件和状态，准确定位当前值为“波浪”的“特别关注提示音”整行入口。
      locateAllInteractiveControls: true
      includeControlTypes: [button, icon_button, link, menu, list_entry, toggle, checkbox, radio, segmented_control, tab, slider, stepper, input, back, close, scroll_region]
      requireScrollCoverage: false
    allowedActions: [open_special_follow_sound]
    postcondition: 当前设置页完成盘点。
  - key: messages.special_follow.settings.sound.selector
    label: 特别关注提示音选择状态
    kind: dialog
    expectedStablePageKey: messages.special_follow.settings.sound
    requiredSemanticAssertions:
      - 当前画面显示由“特别关注提示音”行打开的提示音选项界面或面板，至少可见提示音“波浪”。
    inspection:
      queryPrompt: 完整盘点提示音选择界面或面板的标题、全部可见提示音名称、当前选中标记、试听或确认行为、取消/返回/关闭控件和真实可辨滚动区域；逐项定位，不从声音名称猜测音效。
      locateAllInteractiveControls: true
      includeControlTypes: [button, icon_button, link, menu, list_entry, toggle, checkbox, radio, segmented_control, tab, slider, stepper, input, back, close, scroll_region]
      requireScrollCoverage: true
    allowedActions: []
    postcondition: 已记录提示音选择状态当前视口全部选项和控件。

actions:
  - id: capture-settings-before-sound
    kind: capture
    state: messages.special_follow.settings.interval_30
    depth: 2
  - id: open-special-follow-sound
    kind: tap
    semanticAction: open_special_follow_sound
    fromState: messages.special_follow.settings.interval_30
    toState: messages.special_follow.settings.sound.selector
    depth: 3
    risk: low
    sideEffects: [temporary_display_state]
    waitMs: 2200
    target:
      key: special_follow_sound
      label: 特别关注提示音
      scope: settings_navigation
      locatorPrompt: 定位“特别关注提醒”页“个性化提醒”标题下方、左侧文字“特别关注提示音”、右侧当前值“波浪”和向右箭头的整行入口。
      allowedRegionRef: special-follow-sound-row
    postcondition:
      expectedForegroundPackage: com.zto.connect.fat
      requiredScreenshotChange: true
      semanticAssertions:
        - 当前画面出现由“特别关注提示音”行打开的提示音选项界面或面板，提示音“波浪”可见。

