      label: 单聊消息未读弹窗提醒帮助问号
      scope: temporary_state_control
      locatorPrompt: 定位“特别关注提醒”页“单聊消息未读，弹窗提醒我”文字紧右侧的第一个灰色圆圈问号；不要定位下方两枚问号。
