expectedStates:
  - key: messages.special_follow.settings
    label: 特别关注提醒设置页
    kind: page
    expectedStablePageKey: messages.special_follow.settings
    requiredSemanticAssertions:
      - 页面顶部标题文字为“特别关注提醒”，第一项“单聊消息未读，弹窗提醒我”右侧灰色圆圈问号可见。
    inspection:
      queryPrompt: 完整盘点“特别关注提醒”当前视口全部交互控件与状态，重点区分三个帮助问号，不激活其他控件。
      locateAllInteractiveControls: true
      includeControlTypes: [button, icon_button, link, menu, list_entry, toggle, checkbox, radio, segmented_control, tab, slider, stepper, input, back, close, scroll_region]
      requireScrollCoverage: false
    allowedActions: [open_popup_reminder_help]
    postcondition: 设置页完成盘点。
  - key: messages.special_follow.settings.popup_reminder_help
    label: 单聊弹窗提醒帮助呈现
    kind: dialog
    expectedStablePageKey: messages.special_follow.settings.popup_reminder_help
    requiredSemanticAssertions:
      - 当前画面显示由“单聊消息未读，弹窗提醒我”右侧问号打开的帮助说明层，帮助文字或弹层边界清晰可见。
    inspection:
      queryPrompt: 完整盘点第一项提醒帮助说明层的标题、正文、全部按钮、关闭方式和背景遮罩；仅记录当前可见事实，不推断未显示内容。
      locateAllInteractiveControls: true
      includeControlTypes: [button, icon_button, link, menu, list_entry, back, close, scroll_region]
      requireScrollCoverage: false
    allowedActions: []
    postcondition: 已记录第一项帮助说明层的全部可见内容与控件。

actions:
