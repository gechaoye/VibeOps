fields:
- key: communityType
  appliesTo: [Community]
  label: 社区类型
  description: 用于区分社区汇聚的是应用、功能、服务、数据库、需求还是质量资产
  valueType: option
  optionSetRef: community-type
  required: true
  searchable: true
- key: functionType
  appliesTo: [Function]
  label: 功能类型
  description: 功能主体采用的实现形态；功能内部的个别页面仍可使用不同实现类型
  valueType: option
  optionSetRef: function-type
  required: true
  searchable: true
- key: functionRef
  appliesTo: [Page]
  label: 所属功能
  description: 页面归属的功能，例如特别关注、待办
  valueType: entity_ref
  required: false
  searchable: true
- key: implementationType
  appliesTo: [Page]
  label: 页面实现类型
  description: 页面由原生、RN、H5 或小程序实现
  valueType: option
  optionSetRef: implementation-type
  required: true
  searchable: true
- key: surfaceType
  appliesTo: [Page]
  label: 页面形态
  description: 页面在界面中的呈现形态，例如普通页面、对话框、抽屉或底部弹层
  valueType: option
  optionSetRef: surface-type
  required: true
  defaultValue: page
  searchable: true
- key: stateDefinitions
  appliesTo: [Page]
  label: 页面状态定义
  description: 页面在不同业务条件下可能出现的稳定状态，例如空列表、加载完成或无权限
  valueType: object_list
  required: false
  itemFields:
  - {key: key, label: 状态键, valueType: string, required: true}
  - {key: label, label: 状态名称, valueType: string, required: true}
  - {key: description, label: 状态说明, valueType: text, required: false}
- key: elementType
  appliesTo: [Element]
  label: 元素类型
  description: 按可观察形态选择；广告按呈现形态归入浮层卡片等现有类型，业务用途和反馈级别写入元素描述；滚动记录为元素动作
  valueType: option
  optionSetRef: element-type
  required: true
  searchable: true
- key: displayCondition
  appliesTo: [Element]
  label: 展示条件
  description: 元素能够出现在页面中的业务前置条件，例如当前用户存在以参会人身份加入的会议，或广告已经完成配置；由用户维护
  valueType: text
  required: false
  searchable: true
- key: gridColumns
  appliesTo: [Element]
  label: 横向分割块数
  description: 将元素所在画面从左到右等分的块数，取值为 1 至 12
  valueType: integer
  required: false
- key: gridRows
  appliesTo: [Element]
  label: 纵向分割块数
  description: 将元素所在画面从上到下等分的块数，取值为 1 至 12
  valueType: integer
  required: false
- key: gridRegion
  appliesTo: [Element]
  label: 宫格区域编号
  description: 根据完整元素边框自动定位；系统会动态调整横纵分割块数，确保元素完整落入单一区域，并从左上角开始按从左到右、从上到下的顺序由 1 编号
  valueType: integer
  required: false
- key: capabilities
  appliesTo: [Element]
  label: 元素动作
  description: 用户对元素实际执行的物理交互动作；删除、提交、跳转等业务结果填写在动作效果中，没有交互时选择“无”
  valueType: multi_option
  optionSetRef: element-action
  required: true
- key: actionEffects
  appliesTo: [Element]
  label: 动作效果
  description: 每个物理交互动作实际产生的业务结果，例如点击后删除成员或进入特别关注页面
  valueType: object_list
  required: false
  itemFields:
  - {key: action, label: 元素动作, valueType: option, optionSetRef: element-action, required: true}
  - {key: effect, label: 效果说明, valueType: string, required: true}
- key: interactionBoundary
  appliesTo: [Element]
  label: 交互区域
  description: 元素中实际响应操作的区域，与 Inspector 的交互区域一致
  valueType: option
  optionSetRef: interaction-boundary
  required: false
- key: operation
  appliesTo: [Interaction]
  label: 操作类型
  description: 用户触发该交互时执行的操作，例如点击、输入或滑动
  valueType: string
  required: true
- key: reversible
  appliesTo: [Interaction]
  label: 可回退
  description: 执行交互后是否存在明确的返回或撤销路径
  valueType: boolean
  required: true
- key: risk
  appliesTo: [Interaction]
  label: 风险等级
  description: 交互可能造成的数据或业务影响程度
  valueType: option
  optionSetRef: risk-level
  required: true

relationTypes:
  member_of:
    label: 归属于社区
    description: 指明一个对象被哪个社区收纳和组织
    sourceTypes: ['*']
    targetTypes: [Community]
  provides_function:
    label: 应用提供功能
    description: 指明某项功能由哪个应用对外提供
    sourceTypes: [Application]
    targetTypes: [Function]
  contains:
    label: 页面包含元素
    description: 描述页面或容器元素中的直接子元素
    sourceTypes: [Page, Element]
    targetTypes: [Element]
    constraints: {singleStructuralParent: true, acyclic: true}
  triggers:
    label: 元素触发交互
    description: 用户操作某个可交互元素后启动一项交互
    sourceTypes: [Element]
    targetTypes: [Interaction]
    constraints: {sourceHasAction: true}
  starts_from:
    label: 交互起始页面
    description: 指明交互发生前用户所在的页面
    sourceTypes: [Interaction]
    targetTypes: [Page]
  navigates_to:
    label: 交互进入页面
    description: 指明交互完成后进入的目标页面
    sourceTypes: [Interaction]
    targetTypes: [Page]
  changes_state:
    label: 交互改变状态
    description: 指明交互会改变哪个页面或元素的显示状态
    sourceTypes: [Interaction]
    targetTypes: [Page, Element]
  calls:
    label: 交互调用接口
    description: 指明用户交互直接触发调用的接口
    sourceTypes: [Interaction]
    targetTypes: [API]
  loads_from:
    label: 页面加载接口
    description: 指明页面进入或刷新时用于加载数据的接口
    sourceTypes: [Page]
    targetTypes: [API]
  provided_by:
    label: 接口由服务提供
    description: 指明接口的实际后端服务归属
    sourceTypes: [API]
    targetTypes: [Service]
  configured_by:
    label: 使用配置项
    description: 指明对象的行为受哪些配置项控制
    sourceTypes: [Application, Function, Page, Element, Service]
    targetTypes: [ConfigItem]
  reads_from:
    label: 读取数据
    description: 指明接口或服务会读取的数据库、表或字段
    sourceTypes: [API, Service]
    targetTypes: [Database, Table, Field]
  writes_to:
    label: 写入数据
    description: 指明接口或服务会修改的数据库、表或字段
    sourceTypes: [API, Service]
    targetTypes: [Database, Table, Field]
  specified_by:
    label: 由需求定义
    description: 将功能和实现对象追溯到产品文档、需求或业务规则
    sourceTypes: [Function, Page, Interaction, API]
    targetTypes: [PRD, Requirement, BusinessRule]
  implemented_by:
    label: 由技术资产实现
    description: 将功能、页面、元素或接口关联到代码和服务实现
    sourceTypes: [Function, Page, Element, Interaction, API]
    targetTypes: [CodeRepository, CodeModule, Service]
  covered_by:
    label: 由测试覆盖
    description: 指明验证该对象的测试集或测试用例
    sourceTypes: [Function, Page, Element, Interaction, API]
    targetTypes: [TestSuite, TestCase]
  affected_by:
    label: 受缺陷影响
    description: 指明当前缺陷影响的项目对象
    sourceTypes: ['*']
    targetTypes: [Defect]
