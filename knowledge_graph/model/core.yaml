modelVersion: 1.0.0
name: VibeOps Project Graph Core

entityTypes:
  Project: {label: 项目, group: project, description: 公司内一个可独立管理的产品或研发项目，例如宝盒}
  Community: {label: 社区, group: project, description: 围绕应用、功能或某类资产形成的知识集合}
  Application: {label: 应用, group: product, description: 项目中的可运行应用，例如宝盒、开放平台或配置平台}
  Function: {label: 功能, group: product, description: 面向用户或业务提供的一项完整能力，由相关页面、接口和规则共同组成}
  Page: {label: 页面, group: ui, description: 稳定的业务页面定义；不同设备画面作为观测记录保存}
  Element: {label: 页面元素, group: ui, description: 页面中可识别的按钮、文本、列表项、容器等界面对象}
  Interaction: {label: 用户交互, group: ui, description: 用户操作元素后发生的跳转、状态变化或接口调用}
  Service: {label: 服务, group: service, description: 为应用或接口提供能力的后端服务}
  API: {label: 接口, group: service, description: 应用、页面或交互调用的服务接口}
  APIDoc: {label: 接口文档, group: service, description: 描述接口用途、参数和返回值的文档}
  ConfigItem: {label: 配置项, group: service, description: 影响应用、功能或服务行为的可维护配置}
  CodeRepository: {label: 代码仓库, group: engineering, description: 承载项目源代码的仓库}
  CodeModule: {label: 代码模块, group: engineering, description: 实现功能、页面、接口或交互的具体代码模块}
  Database: {label: 数据库, group: data, description: 项目使用的数据库实例或逻辑数据库}
  Schema: {label: 数据库 Schema, group: data, description: 数据库中的命名空间或结构集合}
  Table: {label: 数据表, group: data, description: 保存业务数据的数据库表}
  Field: {label: 数据字段, group: data, description: 数据表中的字段定义}
  PRD: {label: 产品文档, group: requirement, description: 描述产品目标和功能方案的需求文档}
  Requirement: {label: 需求, group: requirement, description: 可追踪到功能、页面和实现的具体需求项}
  BusinessRule: {label: 业务规则, group: requirement, description: 限制或决定业务行为的规则}
  TestSuite: {label: 测试集, group: quality, description: 围绕功能或版本组织的一组测试用例}
  TestCase: {label: 测试用例, group: quality, description: 验证功能、页面、接口或交互的测试步骤与预期}
  TestRun: {label: 测试执行, group: quality, description: 某次实际测试的环境、结果和证据}
  Defect: {label: 缺陷, group: quality, description: 影响项目对象的已发现问题}
  Release: {label: 发布版本, group: engineering, description: 应用或服务的一次可追踪发布}

