pages:
  - key: messages.root
    title: 消息
    kind: page
    summary: 消息一级页；顶部工具栏提供特别关注入口，并以橙黄色高亮表示特别关注人员存在未读消息。
    hostPageKey: null
    defaultStateKey: special_follow_inactive
    states:
      - key: special_follow_inactive
        label: 特别关注入口未高亮
        expectedElementKeys:
          - messages.root.special_follow_entry
        stateHints:
          - messages.root
          - messages.root.no_special_follow_unread
          - messages.root.returned_from_special_follow
      - key: special_follow_unread_highlighted
        label: 特别关注入口因存在未读消息而橙黄色高亮
        expectedElementKeys:
          - messages.root.special_follow_entry
        stateHints:
          - messages.root.with_special_follow_unread_highlight

  - key: messages.special_follow
    title: 特别关注
    kind: page
    summary: 展示特别关注成员与其会话；特别关注人员存在未读消息时展示对应会话和实时未读数量角标。
    hostPageKey: null
    defaultStateKey: empty
    states:
      - key: empty
        label: 暂无特别关注成员或会话
        expectedElementKeys:
          - messages.special_follow.collapse
          - messages.special_follow.settings_entry
        stateHints:
          - messages.special_follow.initial
          - messages.special_follow.empty
          - messages.special_follow.empty_after_people_close
          - messages.special_follow.empty_returned
      - key: read_conversation
        label: 已关注成员及已读会话
        expectedElementKeys:
          - messages.special_follow.collapse
          - messages.special_follow.settings_entry
          - messages.special_follow.member_entry
          - messages.special_follow.conversation_entry
        stateHints:
          - messages.special_follow.with_read_lian_liangwei
          - messages.special_follow.with_read_lian_liangwei_after_return
          - messages.special_follow.with_read_lian_liangwei_after_member_return
      - key: unread_conversation
        label: 已关注成员及含实时未读数量的会话
        expectedElementKeys:
          - messages.special_follow.collapse
          - messages.special_follow.settings_entry
          - messages.special_follow.member_entry
          - messages.special_follow.conversation_entry
          - messages.special_follow.unread_badge
        stateHints:
          - messages.special_follow.with_unread_member
          - messages.special_follow.with_dynamic_unread_after_settings
          - messages.special_follow.with_dynamic_unread_for_people
          - messages.special_follow.with_dynamic_unread_badge_located
          - messages.special_follow.with_unread_before_help_close

